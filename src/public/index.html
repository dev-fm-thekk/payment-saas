<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment SDK Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="min-h-screen bg-gray-50 flex flex-col items-center py-10 px-4">

    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden">
        <!-- Header / Tabs -->
        <div class="bg-indigo-600 p-6">
            <h1 class="text-2xl font-bold text-white mb-4">Payment SDK Dashboard</h1>
            <div class="flex space-x-4">
                <button onclick="showTab('payment')" class="tab-btn px-4 py-2 bg-indigo-700 text-white rounded-lg hover:bg-indigo-800 transition">Payment</button>
                <button onclick="showTab('plans')" class="tab-btn px-4 py-2 text-indigo-100 hover:text-white transition">Plans</button>
                <button onclick="showTab('history')" class="tab-btn px-4 py-2 text-indigo-100 hover:text-white transition">History</button>
            </div>
        </div>

        <!-- Payment Section -->
        <div id="payment-section" class="section p-8">
            <div class="max-w-md mx-auto">
                <h2 class="text-xl font-semibold text-gray-800 mb-6 text-center">Send Money</h2>
                <div class="space-y-5">
                    <div>
                        <label for="currency" class="block text-sm font-medium text-gray-700 mb-2">Currency</label>
                        <select id="currency" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                            <option value="INR">INR (₹)</option>
                            <option value="USD">USD ($)</option>
                        </select>
                    </div>
                    <div>
                        <label for="amount" class="block text-sm font-medium text-gray-700 mb-2">Amount</label>
                        <input type="number" id="amount" placeholder="Enter amount" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                    </div>
                    <button id="pay-button" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition shadow-md">
                        Pay Now
                    </button>
                </div>
            </div>
        </div>

        <!-- Plans Section -->
        <div id="plans-section" class="section p-8 hidden">
            <h2 class="text-xl font-semibold text-gray-800 mb-6">Available Plans</h2>
            <div id="plans-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Plans will be loaded here -->
                <p class="text-gray-500 italic">No plans created yet. Use the API to create some.</p>
            </div>
        </div>

        <!-- History Section -->
        <div id="history-section" class="section p-8 hidden">
            <h2 class="text-xl font-semibold text-gray-800 mb-6">Payment History</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b">
                            <th class="py-3 px-4 font-semibold text-gray-700">Order ID</th>
                            <th class="py-3 px-4 font-semibold text-gray-700">Amount</th>
                            <th class="py-3 px-4 font-semibold text-gray-700">Status</th>
                            <th class="py-3 px-4 font-semibold text-gray-700">Date</th>
                        </tr>
                    </thead>
                    <tbody id="history-list">
                        <!-- History items will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
